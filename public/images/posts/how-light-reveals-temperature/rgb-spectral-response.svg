<!-- RGB 光谱响应示意：展示宽波段响应及通道之间的重叠，不对应具体相机型号。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 65 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Typical RGB spectral responses</title>
  <desc id="desc">Individually normalized red, green, and blue channel responses. Each channel covers a broad wavelength range, and the responses overlap.</desc>

  <style>
    .axis,
    .tick,
    .grid,
    .curve {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis {
      stroke-width: 2.8;
    }

    .tick {
      stroke-width: 1.8;
    }

    .grid {
      stroke-width: 1.3;
      stroke-dasharray: 5 8;
      opacity: 0.22;
    }

    .curve {
      stroke-width: 4.5;
    }

    .curve-green {
      stroke-dasharray: 14 8;
    }

    .curve-blue {
      stroke-dasharray: 3 10;
    }

    .response-area {
      fill: currentColor;
      fill-opacity: 0.035;
      stroke: none;
    }

    text {
      fill: currentColor;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 21px;
    }

    .title {
      font-size: 31px;
      font-weight: 650;
    }

    .axis-label {
      font-size: 25px;
      font-weight: 550;
    }

    .channel-label {
      font-size: 25px;
      font-weight: 700;
    }

    .note {
      font-size: 20px;
      opacity: 0.76;
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor" />
    </marker>
  </defs>

  <!-- 辅助网格只帮助比较波段范围，不表示统一的相机标定标准。 -->
  <g aria-hidden="true">
    <path class="grid" d="M 105 302.5 H 1025" />
    <path class="grid" d="M 105 105 H 1025" />
    <path class="grid" d="M 159.1 105 V 500" />
    <path class="grid" d="M 294.4 105 V 500" />
    <path class="grid" d="M 429.7 105 V 500" />
    <path class="grid" d="M 565.0 105 V 500" />
    <path class="grid" d="M 700.3 105 V 500" />
    <path class="grid" d="M 835.6 105 V 500" />
    <path class="grid" d="M 970.9 105 V 500" />
  </g>

  <path class="axis" d="M 105 500 H 1055" marker-end="url(#arrow)" />
  <path class="axis" d="M 105 530 V 78" marker-end="url(#arrow)" />

  <g aria-hidden="true">
    <path class="tick" d="M 159.1 500 V 512" />
    <path class="tick" d="M 294.4 500 V 512" />
    <path class="tick" d="M 429.7 500 V 512" />
    <path class="tick" d="M 565.0 500 V 512" />
    <path class="tick" d="M 700.3 500 V 512" />
    <path class="tick" d="M 835.6 500 V 512" />
    <path class="tick" d="M 970.9 500 V 512" />
    <text x="159.1" y="541" text-anchor="middle">400</text>
    <text x="294.4" y="541" text-anchor="middle">450</text>
    <text x="429.7" y="541" text-anchor="middle">500</text>
    <text x="565.0" y="541" text-anchor="middle">550</text>
    <text x="700.3" y="541" text-anchor="middle">600</text>
    <text x="835.6" y="541" text-anchor="middle">650</text>
    <text x="970.9" y="541" text-anchor="middle">700</text>

    <path class="tick" d="M 93 500 H 105" />
    <path class="tick" d="M 93 302.5 H 105" />
    <path class="tick" d="M 93 105 H 105" />
    <text x="78" y="507" text-anchor="end">0</text>
    <text x="78" y="309.5" text-anchor="end">0.5</text>
    <text x="78" y="112" text-anchor="end">1.0</text>
  </g>

  <text class="axis-label" x="1023" y="590" text-anchor="end">Wavelength λ (nm)</text>
  <text class="axis-label" x="35" y="310" text-anchor="middle" transform="rotate(-90 35 310)">Relative spectral response</text>

  <!-- 三条钟形曲线用于说明宽波段与重叠，参数不取自特定传感器。 -->
