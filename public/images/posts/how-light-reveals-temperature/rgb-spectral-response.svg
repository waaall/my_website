  />
  <polyline
    class="curve curve-green"
    points="105.0,499.4 118.5,499.1 132.1,498.7 145.6,498.0 159.1,497.1 172.6,495.9 186.2,494.2 199.7,492.0 213.2,488.9 226.8,485.0 240.3,480.0 253.8,473.6 267.4,465.6 280.9,455.8 294.4,444.0 307.9,430.0 321.5,413.7 335.0,395.0 348.5,374.0 362.1,350.8 375.6,325.7 389.1,299.1 402.6,271.6 416.2,243.7 429.7,216.4 443.2,190.3 456.8,166.4 470.3,145.5 483.8,128.3 497.4,115.5 510.9,107.7 524.4,105.0 537.9,107.7 551.5,115.5 565.0,128.3 578.5,145.5 592.1,166.4 605.6,190.3 619.1,216.4 632.6,243.7 646.2,271.6 659.7,299.1 673.2,325.7 686.8,350.8 700.3,374.0 713.8,395.0 727.4,413.7 740.9,430.0 754.4,444.0 767.9,455.8 781.5,465.6 795.0,473.6 808.5,480.0 822.1,485.0 835.6,488.9 849.1,492.0 862.6,494.2 876.2,495.9 889.7,497.1 903.2,498.0 916.8,498.7 930.3,499.1 943.8,499.4 957.4,499.6 970.9,499.7 984.4,499.8 997.9,499.9 1011.5,499.9 1025.0,500.0"
  />
  <polyline
    class="curve"
    points="105.0,500.0 118.5,500.0 132.1,500.0 145.6,500.0 159.1,500.0 172.6,500.0 186.2,499.9 199.7,499.9 213.2,499.8 226.8,499.8 240.3,499.7 253.8,499.5 267.4,499.3 280.9,498.9 294.4,498.5 307.9,497.9 321.5,497.0 335.0,495.9 348.5,494.4 362.1,492.4 375.6,489.9 389.1,486.7 402.6,482.6 416.2,477.6 429.7,471.4 443.2,463.9 456.8,454.9 470.3,444.3 483.8,431.9 497.4,417.7 510.9,401.5 524.4,383.5 537.9,363.6 551.5,342.1 565.0,319.2 578.5,295.1 592.1,270.4 605.6,245.5 619.1,220.9 632.6,197.2 646.2,175.1 659.7,155.1 673.2,137.8 686.8,123.8 700.3,113.5 713.8,107.1 727.4,105.0 740.9,107.1 754.4,113.5 767.9,123.8 781.5,137.8 795.0,155.1 808.5,175.1 822.1,197.2 835.6,220.9 849.1,245.5 862.6,270.4 876.2,295.1 889.7,319.2 903.2,342.1 916.8,363.6 930.3,383.5 943.8,401.5 957.4,417.7 970.9,431.9 984.4,444.3 997.9,454.9 1011.5,463.9 1025.0,471.4"
  />

  <!-- 线型与标签共同区分通道，使图在明暗主题和单色打印下都可读。 -->
  <text class="channel-label" x="321.5" y="88" text-anchor="middle">B</text>
  <text class="channel-label" x="524.4" y="88" text-anchor="middle">G</text>
  <text class="channel-label" x="727.4" y="88" text-anchor="middle">R</text>

</svg>
