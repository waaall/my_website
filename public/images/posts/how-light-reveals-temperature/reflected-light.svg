<!-- 日常可见光成像示意：区分物体反射的环境光与自身的热辐射。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 90 1080 410" role="img" aria-labelledby="title desc">
  <title id="title">Reflected-light imaging</title>
  <desc id="desc">Visible light travels from a lamp or the Sun to an object, then reaches an eye or camera after reflection.</desc>

  <style>
    .line,
    .shape {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line {
      stroke-width: 4;
    }

    .thin {
      stroke-width: 2.5;
    }

    .dashed {
      stroke-dasharray: 11 11;
    }

    .soft-fill {
      fill: currentColor;
      fill-opacity: 0.07;
    }

    text {
      fill: currentColor;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 25px;
    }

    .title {
      font-size: 31px;
      font-weight: 650;
    }

    .label {
      font-size: 27px;
      font-weight: 600;
    }

    .note {
      font-size: 22px;
      opacity: 0.78;
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 Z" fill="currentColor" />
    </marker>
  </defs>

  <!-- 左侧光源。 -->
  <g aria-label="Lamp or Sun">
    <circle class="shape soft-fill line" cx="145" cy="238" r="60" />
    <path class="line" d="M 145 145 V 118 M 145 358 V 331 M 52 238 H 25 M 265 238 H 238 M 79 172 L 59 152 M 231 324 L 211 304 M 79 304 L 59 324 M 231 152 L 211 172" />
    <text class="label" x="145" y="405" text-anchor="middle">Lamp / Sun</text>
  </g>

  <!-- 中部物体，斜面表示桌面。 -->
  <g aria-label="Object">
    <path class="shape soft-fill line" d="M 398 284 L 625 284 L 701 348 L 323 348 Z" />
    <path class="line" d="M 359 348 V 431 M 664 348 V 431" />
    <text class="label" x="512" y="474" text-anchor="middle">Object</text>
  </g>

  <!-- 右侧用镜头和传感器表示观察者。 -->
  <g aria-label="Eye or camera">
    <rect class="shape soft-fill line" x="848" y="208" width="160" height="112" rx="16" />
    <circle class="shape line" cx="898" cy="264" r="31" />
    <path class="line thin" d="M 950 235 H 980 M 950 264 H 980 M 950 293 H 980" />
    <text class="label" x="928" y="369" text-anchor="middle">Eye / Camera</text>
  </g>

  <!-- 实线箭头表示进入可见光相机的主要路径。 -->
  <path class="line" d="M 222 242 C 300 238, 337 252, 414 292" marker-end="url(#arrow)" />
  <text x="319" y="214" text-anchor="middle">Incident light</text>

  <path class="line" d="M 604 287 C 689 240, 758 231, 841 254" marker-end="url(#arrow)" />
  <text x="727" y="205" text-anchor="middle">Reflected light</text>
</svg>
