<!-- 光学测温证据链：把观测变成温度估计前需要完成的五个环节。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="910" viewBox="0 0 980 910" role="img" aria-labelledby="title desc">
  <title id="title">通过光推断温度的证据链</title>
  <desc id="desc">依次定义要测量的温度，明确发光与传播机制，标定相机和完整光路，根据物理模型反推温度，最后使用独立数据验证。</desc>

  <style>
    .card,
    .line {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      fill: currentColor;
      fill-opacity: 0.055;
      stroke-width: 2.5;
    }

    .line {
      stroke-width: 3.5;
    }

    .number {
      fill: currentColor;
    }

    text {
      fill: currentColor;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 24px;
    }

    .title {
      font-size: 32px;
      font-weight: 650;
    }

    .step {
      font-size: 28px;
      font-weight: 650;
    }

    .detail {
      font-size: 21px;
      opacity: 0.78;
    }

    .number-text {
      fill: white;
      font-size: 24px;
      font-weight: 700;
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 Z" fill="currentColor" />
    </marker>
  </defs>

  <text class="title" x="490" y="50" text-anchor="middle">从像素到温度，需要一条完整的证据链</text>

  <!-- 每一步都保留主问题与补充说明，避免把流程误解成单个换算公式。 -->
  <g transform="translate(0 0)">
    <rect class="card" x="175" y="86" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="142" r="25" />
    <text class="number-text" x="222" y="150" text-anchor="middle">1</text>
    <text class="step" x="275" y="135">定义要测的温度</text>
    <text class="detail" x="275" y="169">热力学温度、辐射温度，还是等效温度？</text>
  </g>

  <path class="line" d="M 490 198 V 240" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="249" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="305" r="25" />
    <text class="number-text" x="222" y="313" text-anchor="middle">2</text>
    <text class="step" x="275" y="298">明确光怎样产生和传播</text>
    <text class="detail" x="275" y="332">热辐射、非热发光、反射、吸收与视线积分</text>
  </g>

  <path class="line" d="M 490 361 V 403" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="412" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="468" r="25" />
    <text class="number-text" x="222" y="476" text-anchor="middle">3</text>
    <text class="step" x="275" y="461">标定相机与完整光路</text>
    <text class="detail" x="275" y="495">让响应可追溯、可重复，并明确不确定度</text>
  </g>

  <path class="line" d="M 490 524 V 566" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="575" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="631" r="25" />
    <text class="number-text" x="222" y="639" text-anchor="middle">4</text>
    <text class="step" x="275" y="624">根据物理模型反推温度</text>
    <text class="detail" x="275" y="658">说明假设、适用范围以及解的不唯一性</text>
  </g>

  <path class="line" d="M 490 687 V 729" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="738" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="794" r="25" />
    <text class="number-text" x="222" y="802" text-anchor="middle">5</text>
    <text class="step" x="275" y="787">用独立数据验证结果</text>
    <text class="detail" x="275" y="821">检查结果能否解释未参与反演的新观测</text>
  </g>
</svg>
