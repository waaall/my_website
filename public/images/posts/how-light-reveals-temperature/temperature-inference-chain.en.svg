<!-- 光学测温证据链：把观测变成温度估计前需要完成的五个环节。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="790" viewBox="0 75 980 790" role="img" aria-labelledby="title desc">
  <title id="title">Evidence chain for optical thermometry</title>
  <desc id="desc">Define the target temperature, model light generation and transport, calibrate the camera and optical chain, infer temperature with a physical model, and validate against independent data.</desc>

  <style>
    .card,
    .line {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      fill: currentColor;
      fill-opacity: 0.055;
      stroke-width: 2.5;
    }

    .line {
      stroke-width: 3.5;
    }

    .number {
      fill: currentColor;
    }

    text {
      fill: currentColor;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 24px;
    }

    .title {
      font-size: 32px;
      font-weight: 650;
    }

    .step {
      font-size: 28px;
      font-weight: 650;
    }

    .detail {
      font-size: 21px;
      opacity: 0.78;
    }

    .number-text {
      fill: white;
      font-size: 24px;
      font-weight: 700;
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 Z" fill="currentColor" />
    </marker>
  </defs>

  <!-- 每一步都保留主问题与补充说明，避免把流程误解成单个换算公式。 -->
  <g transform="translate(0 0)">
    <rect class="card" x="175" y="86" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="142" r="25" />
    <text class="number-text" x="222" y="150" text-anchor="middle">1</text>
    <text class="step" x="275" y="135">Define the target temperature</text>
    <text class="detail" x="275" y="169">Thermodynamic, radiative, or effective?</text>
  </g>

  <path class="line" d="M 490 198 V 240" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="249" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="305" r="25" />
    <text class="number-text" x="222" y="313" text-anchor="middle">2</text>
    <text class="step" x="275" y="298">Model light generation &amp; transport</text>
    <text class="detail" x="275" y="332">Emission · reflection · absorption · path integral</text>
  </g>

  <path class="line" d="M 490 361 V 403" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="412" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="468" r="25" />
    <text class="number-text" x="222" y="476" text-anchor="middle">3</text>
    <text class="step" x="275" y="461">Calibrate the camera &amp; optical chain</text>
    <text class="detail" x="275" y="495">Traceability · repeatability · uncertainty</text>
  </g>

  <path class="line" d="M 490 524 V 566" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="575" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="631" r="25" />
    <text class="number-text" x="222" y="639" text-anchor="middle">4</text>
    <text class="step" x="275" y="624">Infer temperature with a physics model</text>
    <text class="detail" x="275" y="658">Assumptions · validity range · non-uniqueness</text>
  </g>

  <path class="line" d="M 490 687 V 729" marker-end="url(#arrow)" />

  <g>
    <rect class="card" x="175" y="738" width="630" height="112" rx="18" />
    <circle class="number" cx="222" cy="794" r="25" />
    <text class="number-text" x="222" y="802" text-anchor="middle">5</text>
    <text class="step" x="275" y="787">Validate with independent data</text>
    <text class="detail" x="275" y="821">Predict measurements excluded from the inversion</text>
  </g>
</svg>
