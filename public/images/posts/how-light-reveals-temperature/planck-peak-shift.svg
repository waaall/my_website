<!-- 黑体峰值移动示意：各温度曲线分别归一化，只比较按波长表示的谱形与峰位。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="585" viewBox="0 65 1120 585" role="img" aria-labelledby="title desc">
  <title id="title">Peak shift in blackbody spectra</title>
  <desc id="desc">Individually normalized blackbody spectra at 1000, 2000, and 5800 kelvin. Their peak wavelengths are approximately 2.90, 1.45, and 0.50 micrometres.</desc>

  <style>
    .axis,
    .tick,
    .curve,
    .guide {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis {
      stroke-width: 2.8;
    }

    .tick {
      stroke-width: 1.8;
    }

    .curve {
      stroke-width: 4;
    }

    .curve-2000 {
      stroke-dasharray: 13 8;
    }

    .curve-1000 {
      stroke-dasharray: 4 9;
    }

    .guide {
      stroke-width: 1.7;
      stroke-dasharray: 7 8;
      opacity: 0.55;
    }

    .visible-band {
      fill: currentColor;
      fill-opacity: 0.09;
    }

    .peak {
      fill: currentColor;
    }

    text {
      fill: currentColor;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 22px;
    }

    .title {
      font-size: 31px;
      font-weight: 650;
    }

    .axis-label {
      font-size: 25px;
      font-weight: 550;
    }

    .curve-label {
      font-size: 23px;
      font-weight: 650;
    }

    .note {
      font-size: 20px;
      opacity: 0.76;
    }
  </style>

  <defs>
    <clipPath id="plot-area">
      <rect x="115" y="105" width="900" height="435" />
    </clipPath>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor" />
    </marker>
  </defs>

  <!-- 可见光仅占横轴左侧的一小段，其余主要是红外波段。 -->
  <rect class="visible-band" x="135.3" y="105" width="62.7" height="435" />
  <text class="note" x="166.5" y="91" text-anchor="middle">Visible</text>
  <text class="note" x="602" y="91" text-anchor="middle">Infrared</text>

  <path class="axis" d="M 115 540 H 1045" marker-end="url(#arrow)" />
  <path class="axis" d="M 115 570 V 79" marker-end="url(#arrow)" />

  <g aria-hidden="true">
    <path class="tick" d="M 154.1 540 V 551" />
    <path class="tick" d="M 232.4 540 V 551" />
    <path class="tick" d="M 388.9 540 V 551" />
    <path class="tick" d="M 545.4 540 V 551" />
    <path class="tick" d="M 702.0 540 V 551" />
    <path class="tick" d="M 858.5 540 V 551" />
    <path class="tick" d="M 1015 540 V 551" />
    <text x="154.1" y="579" text-anchor="middle">0.5</text>
    <text x="232.4" y="579" text-anchor="middle">1</text>
    <text x="388.9" y="579" text-anchor="middle">2</text>
    <text x="545.4" y="579" text-anchor="middle">3</text>
    <text x="702.0" y="579" text-anchor="middle">4</text>
    <text x="858.5" y="579" text-anchor="middle">5</text>
    <text x="1015" y="579" text-anchor="middle">6</text>
  </g>

  <text class="axis-label" x="1008" y="626" text-anchor="end">Wavelength λ (μm)</text>
  <text class="axis-label" x="42" y="325" text-anchor="middle" transform="rotate(-90 42 325)">Normalized spectral radiance</text>

  <!-- 曲线点由 Planck 定律按固定波长间隔计算，再分别除以各自最大值。 -->
