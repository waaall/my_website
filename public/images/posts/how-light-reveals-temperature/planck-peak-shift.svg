    />
  </g>

  <!-- 峰值位置由 Wien 位移关系给出，并用虚线投影到波长轴。 -->
  <path class="guide" d="M 154.1 105 V 540" />
  <path class="guide" d="M 302.7 105 V 540" />
  <path class="guide" d="M 529.4 105 V 540" />
  <circle class="peak" cx="154.1" cy="105" r="6" />
  <circle class="peak" cx="302.7" cy="105" r="6" />
  <circle class="peak" cx="529.4" cy="105" r="6" />

  <text class="curve-label" x="225" y="136">5800 K · 0.50 μm</text>
  <text class="curve-label" x="337" y="185">2000 K · 1.45 μm</text>
  <text class="curve-label" x="571" y="136">1000 K · 2.90 μm</text>
</svg>
